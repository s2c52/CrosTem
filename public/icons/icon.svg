<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- CrosTem: CT monogram on a Steam-gradient tile. The C in Steam accent
       blue, the T in star gold. No third-party marks (Apple/Valve). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a475e"/>
      <stop offset="1" stop-color="#16202d"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="24" fill="none" stroke="#3d5a80" stroke-width="5"/>
  <!-- C -->
  <path d="M 74 38 A 30 30 0 1 0 74 90" fill="none" stroke="#66c0f4" stroke-width="13" stroke-linecap="round"/>
  <!-- T -->
  <g stroke="#ffc82c" stroke-width="12.5" stroke-linecap="round" fill="none">
    <path d="M 70 50 H 106"/>
    <path d="M 88 50 V 92"/>
  </g>
</svg>
