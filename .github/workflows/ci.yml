name: CI

on:
  push:
    branches: [main, development, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dev dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: crostem-dist
          path: dist/

  # Real-Steam smoke: inherently flaky (network, store changes), so it
  # never blocks a merge; failures are a signal to run it locally.
  e2e:
    if: github.event_name == 'pull_request' && github.base_ref == 'development'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: E2E_HEADLESS=1 npm run e2e
      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/
