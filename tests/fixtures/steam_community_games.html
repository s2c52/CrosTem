  PROVISIONAL: that page is login-gated (an anonymous GET returns the Sign In
  page), so this is a hand-built approximation of the structure visible in the
  live UI, not a verbatim dump. Recapture and replace this file wholesale:
  log into Steam, open /id/<you>/games?tab=all, copy a row's outerHTML from
  devtools and strip srcset/styles/noise.

  Every node here encodes something the surface must handle:
    - the capsule anchor has an <img> and no text  -> must be ignored
    - the title anchor carries the game name       -> gets the badge
    - a row exposes the same appid more than once  -> only one badge per game
  Class names are per-build hashes, kept verbatim to prove the code never
  relies on them.
-->
