<!--
  Hand-reduced from a real logged-in capture of the Steam Community games
  list (steamcommunity.com/id/<user>/games?tab=all, 2026-07-26). SVG icon
  paths, srcset noise and the stats dropdowns are stripped; everything the
  surface reads is verbatim.

  Each row links the SAME app three times, in this document order:
    1. the capsule anchor  — wraps <picture>, carries no text  -> ignored
    2. the title anchor    — the game name                     -> gets the badge
    3. "Store Page" inside the row's overflow popover          -> deduped away
  The popover is `popover="manual"`, so it is in the DOM from the start:
  without the per-appid dedupe every row would earn two badges.
  Sibling links (/forum/<id>, /appofficialsite/<id>, /news/?appids=<id>)
  deliberately do NOT contain "/app/" and must stay unmatched.

  Class names are per-build hashes, kept verbatim to prove the code never
  relies on them. Recapture: log into Steam (the page 200s to a Sign In
  page when anonymous), open /my/games?tab=all, copy a row's outerHTML
  from devtools and strip the noise.
-->
